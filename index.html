<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#5695a7">
  <title>TrollMuseum AR</title>
  <style>
    :root {
      color-scheme: only light;
      --brand-background: #5695a7;
      --splash-bottom: calc(env(safe-area-inset-bottom) + 32px);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--brand-background); }
    [hidden] { display: none !important; }
    #canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: manipulation; }
    #splash {
      position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
      background: var(--brand-background);
    }
    #splash-art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #splash-icon {
      display: block; width: min(46vw, 165px, 46dvh); height: auto;
      transform: translateY(max(-46px, -8dvh));
    }
    #splash-art:not([hidden]) + #splash-icon { visibility: hidden; }
    #start-ar {
      position: absolute; bottom: var(--splash-bottom);
      width: min(62%, 220px); min-height: 48px; padding: 12px 20px; border: 0;
      border-radius: 999px; background: #0054a8; color: #fff;
      font: 650 18px/1.2 system-ui, sans-serif; cursor: pointer;
    }
    #loading, .scan-message {
      position: fixed; top: calc(env(safe-area-inset-top) + 16px); left: 50%;
      transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
      padding: 10px 16px; border-radius: 12px; color: #fff; background: #101539;
      text-align: center; font: 600 14px/1.4 system-ui, sans-serif; overflow-wrap: anywhere;
    }
    #loading { z-index: 4; display: flex; align-items: center; gap: 10px; }
    #splash:not([hidden]) ~ #loading { top: auto; bottom: var(--splash-bottom); }
    #loading.error { background: #681b22; }
    #spinner {
      display: none; flex: 0 0 20px; width: 20px; height: 20px;
      border: 2px solid #ffffff50; border-top-color: #fff; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    #loading.busy #spinner { display: block; }
    #scanner { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .scan-graphic {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(128px, 48vw, 50dvh); height: auto;
      filter: drop-shadow(0 2px 4px #0009);
    }
    .scan-phone { animation: scan 2.4s ease-in-out infinite alternate; }
    #resume-audio {
      position: fixed; z-index: 3; left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%);
      min-height: 48px; padding: 12px 18px; border: 0; border-radius: 12px;
      background: #fff; color: #151515; font: 600 16px system-ui, sans-serif;
      white-space: nowrap; cursor: pointer;
    }
    #playback-debug {
      position: fixed; z-index: 5; left: 8px; top: calc(env(safe-area-inset-top) + 72px);
      max-width: calc(100% - 16px); margin: 0; padding: 8px 10px; background: #000c;
      color: #fff; border-radius: 8px; pointer-events: none; white-space: pre-wrap;
      overflow-wrap: anywhere; font: 12px/1.4 monospace;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes scan { from { transform: translateX(-25px); } to { transform: translateX(25px); } }
    @media (prefers-reduced-motion: reduce) {
      #spinner, .scan-phone { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <section id="splash" aria-label="TrollMuseum AR">
    <canvas id="splash-art" role="img" aria-label="TrollMuseum Bergen" hidden></canvas>
    <img id="splash-icon" src="assets/trollmuseum-bergen.png" width="1984" height="1984" alt="TrollMuseum Bergen">
    <button id="start-ar" type="button" hidden>Start AR</button>
  </section>
  <script>
    (() => {
      const splash = document.getElementById('splash')
      const art = document.getElementById('splash-art')
      const icon = document.getElementById('splash-icon')
      const paint = art.getContext('2d', {alpha: false})
      if (!paint) return
      const background = getComputedStyle(splash).getPropertyValue('--brand-background').trim()

      function drawSplash() {
        const {width, height, left, top} = splash.getBoundingClientRect()
        if (!width || !height || !icon.naturalWidth) return
        const logo = icon.getBoundingClientRect()
        const density = Math.min(devicePixelRatio || 1, 2)
        art.width = Math.round(width * density)
        art.height = Math.round(height * density)
        // Draw the logo and its matching background into the same image.
        paint.fillStyle = background
        paint.fillRect(0, 0, art.width, art.height)
        paint.drawImage(icon, (logo.left - left) * density, (logo.top - top) * density,
          logo.width * density, logo.height * density)
        art.hidden = false
      }

      icon.addEventListener('load', drawSplash, {once: true})
      new ResizeObserver(drawSplash).observe(splash)
      drawSplash()
    })()
  </script>
  <div id="scanner" hidden>
    <div class="scan-message" role="status">Point the camera at the image</div>
    <svg class="scan-graphic" viewBox="0 0 128 112" fill="none" stroke="#fff" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="12" width="124" height="88" rx="9" fill="#12203b55" stroke-opacity=".75"/>
      <circle cx="25" cy="35" r="6" opacity=".8"/>
      <path d="M12 84l25-29 19 20 26-34 34 43" opacity=".8"/>
      <g class="scan-phone">
        <rect x="37" y="7" width="54" height="98" rx="10" fill="#162d41" stroke-opacity=".95"/>
        <rect x="43" y="23" width="42" height="65" rx="4" fill="#ffffff12" stroke-opacity=".4"/>
        <path d="M60 15h8m-9 82h10" stroke-opacity=".65"/>
      </g>
    </svg>
  </div>
  <pre id="playback-debug" hidden></pre>
  <button id="resume-audio" type="button" hidden>Enable audio</button>
  <div id="loading" class="busy" role="status" aria-live="polite">
    <span id="spinner" aria-hidden="true"></span><span id="status">Loading AR…</span>
  </div>
  <script id="xr-engine" src="external/xr/xr.js" async data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
