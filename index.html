<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Image Tracking</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100dvh; touch-action: manipulation; }
    #loading { position: fixed; top: calc(env(safe-area-inset-top) + 16px); left: 50%;
      transform: translateX(-50%); max-width: calc(100% - 32px); z-index: 2;
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      color: white; background: rgba(0,0,0,.72); border-radius: 12px;
      font: 14px/1.45 system-ui, sans-serif; overflow-wrap: anywhere; }
    #loading[hidden] { display: none; }
    #spinner { display: none; flex: 0 0 20px; width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,.25); border-top-color: white;
      border-radius: 50%; animation: spin .8s linear infinite; }
    #loading.busy #spinner { display: block; }
    #loading.error { background: rgba(110,20,20,.95); }
    #start-ar { position: fixed; z-index: 3; inset: 50% auto auto 50%;
      transform: translate(-50%, -50%); min-height: 48px; white-space: nowrap;
      padding: 12px 24px; border: 0; border-radius: 12px; background: #fff;
      color: #151515; font: 600 16px system-ui, sans-serif; cursor: pointer; }
    #resume-audio { position: fixed; z-index: 3; left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%);
      min-height: 48px; padding: 12px 18px; border: 0; border-radius: 12px;
      background: #fff; color: #151515; font: 600 16px system-ui, sans-serif;
      white-space: nowrap; cursor: pointer; }
    #playback-debug { position: fixed; z-index: 4; left: 8px; top: 72px;
      max-width: calc(100% - 16px); margin: 0; padding: 8px 10px;
      background: #000c; color: #fff; border-radius: 8px; pointer-events: none;
      white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 monospace; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <pre id="playback-debug" hidden></pre>
  <button id="start-ar" type="button" hidden>Начать AR</button>
  <button id="resume-audio" type="button" hidden>Включить звук</button>
  <div id="loading" class="busy" role="status" aria-live="polite">
    <span id="spinner" aria-hidden="true"></span><span id="status">Загрузка движка…</span>
  </div>
  <!-- Движок сохраняется из исходного TakashiYoshinaga/8thwall-template. -->
  <script id="xr-engine" src="external/xr/xr.js" async data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
